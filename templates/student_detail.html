{% extends "base.html" %}
{% block title %}{{ student.full_name }}{% endblock %}
{% block content %}
<div class="card">
  <h2>Report Card</h2>
  <pre>{{ report }}</pre>
  <p>
    <a class="btn" href="{{ url_for('edit_student', sid=student.student_id) }}">Edit</a>
    <form method="post" action="{{ url_for('delete_student', sid=student.student_id) }}"
          style="display:inline" onsubmit="return confirm('Delete this student?');">
      <button class="btn danger" type="submit">Delete</button>
    </form>
    <a class="btn" href="{{ url_for('index') }}">Back</a>
  </p>
</div>
{% endblock %}
