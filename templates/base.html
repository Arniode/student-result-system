<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Student Result System{% endblock %}</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0;
           background: #f5f7fa; color: #1f2933; }
    nav { background: #1e3a5f; color: #fff; padding: 0.9rem 1.5rem; }
    nav a { color: #fff; margin-right: 1rem; text-decoration: none; }
    .container { max-width: 920px; margin: 1.5rem auto; padding: 0 1rem; }
    .card { background: #fff; border: 1px solid #d9e2ec; border-radius: 8px;
            padding: 1.25rem; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { border: 1px solid #d9e2ec; padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #eef2f7; }
    .flash { padding: 0.6rem 1rem; border-radius: 4px; margin-bottom: 1rem; }
    .flash.success { background: #e3f9e5; color: #14532d; }
    .flash.error { background: #fdecea; color: #7f1d1d; }
    .btn { display: inline-block; padding: 0.4rem 0.9rem; border-radius: 4px;
           background: #1e3a5f; color: #fff !important; text-decoration: none;
           border: none; cursor: pointer; font-size: 0.95rem; }
    .btn.danger { background: #b91c1c; }
    .btn.small { font-size: 0.8rem; padding: 0.25rem 0.6rem; }
    pre { background: #f4f6f8; padding: 1rem; border-radius: 6px;
          overflow-x: auto; white-space: pre-wrap; }
    label { display: block; margin-top: 0.85rem; font-weight: 600; }
    input, select { width: 100%; padding: 0.45rem; margin-top: 0.25rem;
                    box-sizing: border-box; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
    h2, h3 { color: #1e3a5f; }
    a { color: #1e3a5f; }
  </style>
</head>
<body>
  <nav>
    <strong>Student Result Management System</strong>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('add_student_page') }}">Add Student</a>
    <a href="{{ url_for('statistics') }}">Statistics</a>
    <a href="{{ url_for('export_csv') }}">CSV</a>
    <a href="{{ url_for('export_text') }}">Report</a>
  </nav>
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
